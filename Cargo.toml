[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-only"
repository = "https://github.com/Ermag/rowbit"
homepage = "https://github.com/Ermag/rowbit"
publish = false

[workspace.dependencies]
rowbit-core = { path = "crates/rowbit-core" }
rowbit-engine = { path = "crates/rowbit-engine" }
rowbit-mcp = { path = "crates/rowbit-mcp" }
rowbit-policy = { path = "crates/rowbit-policy" }
rowbit-mysql = { path = "crates/rowbit-mysql" }
rowbit-store = { path = "crates/rowbit-store" }
rowbit-web = { path = "crates/rowbit-web" }

anyhow = "1"
argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "tokio", "query"] }
getrandom = "0.3"
clap = { version = "4", features = ["derive", "env"] }
mysql_async = { version = "0.36", default-features = false, features = ["minimal-rust"] }
rpassword = "7"
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serde_norway = "0.9"
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
