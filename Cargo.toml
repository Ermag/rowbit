[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
repository = "https://github.com/Ermag/rowbit"
homepage = "https://github.com/Ermag/rowbit"
publish = false

[workspace.dependencies]
rowbit-core = { path = "crates/rowbit-core" }
rowbit-engine = { path = "crates/rowbit-engine" }
rowbit-mcp = { path = "crates/rowbit-mcp" }
rowbit-policy = { path = "crates/rowbit-policy" }
rowbit-mysql = { path = "crates/rowbit-mysql" }
rowbit-store = { path = "crates/rowbit-store" }
rowbit-web = { path = "crates/rowbit-web" }

anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "tokio", "query"] }
getrandom = "0.3"
hmac = "0.12"
clap = { version = "4", features = ["derive", "env"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "timing-resistant-secret-traits"] }
# The system's trusted CAs, so an identity provider behind a company CA works.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
mysql_async = { version = "0.36", default-features = false, features = ["minimal-rust"] }
rpassword = "7"
rmcp = { version = "3.5", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
http = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serde_norway = "0.9"
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Release binaries without symbols, about a quarter smaller.
[profile.release]
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
