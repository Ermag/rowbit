# Rowbit policy, schema version 0. See docs/spec/policy.md.
version: 0

agents:
  refund-bot:
    description: Marks approved refund requests as refunded in the billing database.
    # What it may touch at all, enforced by the database on a user of its
    # own (see `rowbit grants`). Rules below decide within this.
    scopes:
      read: [billing.refunds, billing.customers]
      update: [billing.refunds]
      deny_read:
        columns: [billing.customers.email]
    # When no rule matches. hold or block, never allow.
    default: block
    rules:
      - name: small-refund-batches
        when:
          statement: update
          table: billing.refunds
          columns: status
          rows: { max: 50 }
          sum: { column: amount, max: 500 }
        then: allow

      - name: refunds-need-a-person
        when:
          table: billing.refunds
        then: hold
        reason: Large or unusual refund batches are reviewed by billing.

  support-bot:
    description: Updates ticket status and notes.
    # Rules are logged, not enforced, while the team tunes them: writes go
    # through, and the log says what would have been held or blocked.
    # Scopes still apply in shadow mode, so the database keeps this agent
    # to tickets whatever the rules would say.
    mode: shadow
    scopes:
      read: [support.tickets]
      insert: [support.tickets]
      update: [support.tickets]
    rules:
      - name: tickets
        when:
          statement: [insert, update]
          table: support.tickets
          rows: { max: 20 }
        then: allow
      - name: never-touch-billing
        when:
          table: billing.*
        then: block
        reason: Support agents do not write to billing.
    # default: hold. In shadow mode that is logged, and the change applied.
