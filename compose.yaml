# Test databases for integration tests. Not for production use.
#
#   docker compose up -d --wait
#   export ROWBIT_TEST_MARIADB_URL=mysql://rowbit:rowbit@127.0.0.1:33061/rowbit_test
#   export ROWBIT_TEST_MYSQL_URL=mysql://rowbit:rowbit@127.0.0.1:33062/rowbit_test
#   export ROWBIT_TEST_TLS_URL=mysql://rowbit:rowbit@127.0.0.1:33063/rowbit_test
#   cargo test --workspace
name: rowbit-test

services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: rowbit
      MARIADB_DATABASE: rowbit_test
      MARIADB_USER: rowbit
      MARIADB_PASSWORD: rowbit
    ports: ["127.0.0.1:33061:3306"]
    volumes: ["./scripts/test-db-init.sql:/docker-entrypoint-initdb.d/rowbit.sql:ro"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Refuses connections without TLS, as managed databases do, with a
  # certificate from the test CA in scripts/test-tls.
  mariadb-tls:
    image: mariadb:11.4
    command:
      - --require-secure-transport=ON
      - --ssl-ca=/etc/mysql/tls/ca.pem
      - --ssl-cert=/etc/mysql/tls/server.pem
      - --ssl-key=/etc/mysql/tls/server-key.pem
    environment:
      MARIADB_ROOT_PASSWORD: rowbit
      MARIADB_DATABASE: rowbit_test
      MARIADB_USER: rowbit
      MARIADB_PASSWORD: rowbit
    ports: ["127.0.0.1:33063:3306"]
    volumes:
      - ./scripts/test-db-init.sql:/docker-entrypoint-initdb.d/rowbit.sql:ro
      - ./scripts/test-tls:/etc/mysql/tls:ro
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 60

  mysql:
    image: mysql:8.4
    # Lets the non-root test user create triggers while binary logging is on.
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: rowbit
      MYSQL_DATABASE: rowbit_test
      MYSQL_USER: rowbit
      MYSQL_PASSWORD: rowbit
    ports: ["127.0.0.1:33062:3306"]
    volumes: ["./scripts/test-db-init.sql:/docker-entrypoint-initdb.d/rowbit.sql:ro"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      # TCP on 127.0.0.1 only answers once the init-time server has stopped.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-urowbit", "-prowbit", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60
