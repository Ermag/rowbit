name: Release

# On a v* tag: build every target, check the install script against the
# builds, then publish a GitHub Release with the archives, SHA256SUMS and
# build provenance attestations, the container image on ghcr.io built from
# the same Linux binaries, and the MCP Registry listing. Run by hand, or on a
# pull request that touches the build, the image or the install script, it
# does everything but publish.
# See docs/spec/setup.md. Actions are pinned to commits: this workflow
# publishes what install.sh downloads.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "site/install.sh"
      - "Dockerfile"
      - "server.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: version
        name: The tag is the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME isn't v$version, the version in Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      NAME: rowbit-${{ needs.version.outputs.version }}-${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: musl C toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p rowbit-cli --target ${{ matrix.target }}
      - name: Runs
        run: |
          bin=target/${{ matrix.target }}/release/rowbit
          if [ "${{ matrix.target }}" = x86_64-apple-darwin ]; then
            # Built on Apple silicon; runs under Rosetta where the runner has it.
            arch -x86_64 "$bin" --version || echo "::warning::no Rosetta on this runner; x86_64 binary not run"
          else
            "$bin" --version
          fi
          file "$bin"
      - name: Static
        if: runner.os == 'Linux'
        run: |
          out=$(ldd target/${{ matrix.target }}/release/rowbit 2>&1 || true)
          echo "$out"
          echo "$out" | grep -Eq 'not a dynamic executable|statically linked'
      - name: Pack
        run: |
          mkdir "$NAME"
          cp target/${{ matrix.target }}/release/rowbit LICENSE THIRD-PARTY.md README.md CHANGELOG.md "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz
          if-no-files-found: error

  sums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum rowbit-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  install-script:
    needs: [version, sums]
    strategy:
      matrix:
        # macos-15-intel installs the x86_64 build, which the Apple silicon
        # runners can't always run.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck site/install.sh
      - name: Serve the builds
        run: |
          (cd dist && python3 -m http.server 8765 >/dev/null 2>&1 &)
          for _ in $(seq 20); do curl -fs -o /dev/null http://127.0.0.1:8765/SHA256SUMS && exit 0; sleep 0.5; done
          exit 1
      - name: Installs and runs
        env:
          ROWBIT_DOWNLOAD_URL: http://127.0.0.1:8765
          ROWBIT_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          sh site/install.sh
          test "$("$ROWBIT_INSTALL_DIR/rowbit" --version)" = "rowbit ${{ needs.version.outputs.version }}"
      - name: Installs with wget
        if: runner.os == 'Linux'
        env:
          ROWBIT_DOWNLOAD_URL: http://127.0.0.1:8765
          ROWBIT_INSTALL_DIR: ${{ runner.temp }}/bin-wget
        run: |
          mkdir "$RUNNER_TEMP/no-curl"
          for tool in sh uname mktemp grep head cut tar gzip mkdir cp chmod mv rm sha256sum wget; do
            ln -s "$(command -v "$tool")" "$RUNNER_TEMP/no-curl/$tool"
          done
          PATH="$RUNNER_TEMP/no-curl" sh site/install.sh
          "$ROWBIT_INSTALL_DIR/rowbit" --version
      - name: Refuses a download that doesn't match SHA256SUMS
        env:
          ROWBIT_DOWNLOAD_URL: http://127.0.0.1:8765
          ROWBIT_INSTALL_DIR: ${{ runner.temp }}/bin-bad
        run: |
          cp dist/SHA256SUMS sums.good
          # Change every hash's first digit, whatever it was.
          awk '{ c = substr($1, 1, 1); printf "%s%s  %s\n", (c == "0" ? "1" : "0"), substr($1, 2), $2 }' sums.good > dist/SHA256SUMS
          ! cmp -s sums.good dist/SHA256SUMS
          ! grep -qxFf sums.good dist/SHA256SUMS
          if sh site/install.sh; then echo "installed despite a bad checksum"; exit 1; fi
          test ! -e "$ROWBIT_INSTALL_DIR/rowbit"
          cp sums.good dist/SHA256SUMS

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, install-script]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: The archives are the ones SHA256SUMS lists
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/rowbit-*.tar.gz
      - name: Notes
        run: |
          {
            echo "What changed for someone running Rowbit, and how to upgrade: [the changelog](https://github.com/$GH_REPO/blob/$GITHUB_REF_NAME/CHANGELOG.md)."
            echo
            echo 'Install: `curl -fsSL https://ermag.github.io/rowbit/install.sh | sh`. Check an archive came from this workflow with `gh attestation verify <archive> --repo Ermag/rowbit`.'
            echo
            gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body
          } > notes.md
          cat notes.md
      - name: Publish
        run: |
          pre=
          case "$VERSION" in *-*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Rowbit $VERSION" \
            --notes-file notes.md $pre dist/rowbit-*.tar.gz dist/SHA256SUMS

  # Builds the image from the archives already checked against SHA256SUMS
  # and runs it on both platforms. On a tag it pushes the image by digest
  # only, untagged, and runs what it pushed; image-tag names it once the
  # release is out.
  image:
    needs: [version, install-script]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/ermag/rowbit
      PUBLISH: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: The Linux binaries, checked against SHA256SUMS
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}; target=${pair#*:}-unknown-linux-musl
            mkdir -p "dist/$arch"
            tar -xzf "dist/rowbit-$VERSION-$target.tar.gz" -C "dist/$arch" --strip-components=1 "rowbit-$VERSION-$target/rowbit"
          done
          file dist/*/rowbit
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Runs on both platforms
        if: env.PUBLISH != 'true'
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker buildx build --load --platform "$platform" -t rowbit-test .
            test "$(docker run --rm --platform "$platform" rowbit-test --version)" = "rowbit $VERSION"
          done
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: What was pushed runs on both platforms
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            test "$(docker run --rm --platform "$platform" "$IMAGE@$DIGEST" --version)" = "rowbit $VERSION"
          done

  # Names the image only once the release is published, so a failed
  # release never leaves a :<version> or :latest behind.
  image-tag:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, image, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/ermag/rowbit
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: The version's tag is new
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists; a version's image is never replaced"
            exit 1
          fi
      - name: Tag
        run: |
          docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          case "$VERSION" in
            *-*) ;;
            *) docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$DIGEST" ;;
          esac
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true

  # The listing, checked on every run, so a tag doesn't find it broken.
  listing:
    runs-on: ubuntu-latest
    env:
      PUBLISHER: v1.8.8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: mcp-publisher, checked against its signature
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz.sigstore.json"
          cosign verify-blob \
            --bundle mcp-publisher_linux_amd64.tar.gz.sigstore.json \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$PUBLISHER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            mcp-publisher_linux_amd64.tar.gz
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: The listing is valid
        run: |
          if ./mcp-publisher --help 2>&1 | grep -qw validate; then
            ./mcp-publisher validate
          else
            jq -e '.packages[0].runtimeArguments and .packages[0].packageArguments' server.json
          fi

  mcp-registry:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, image-tag, listing]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PUBLISHER: v1.8.8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: mcp-publisher, checked against its signature
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/$PUBLISHER"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "$base/mcp-publisher_linux_amd64.tar.gz.sigstore.json"
          cosign verify-blob \
            --bundle mcp-publisher_linux_amd64.tar.gz.sigstore.json \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$PUBLISHER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            mcp-publisher_linux_amd64.tar.gz
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: This release's version in server.json
        run: |
          jq --arg v "$VERSION" '.version = $v | .packages[0].identifier = "ghcr.io/ermag/rowbit:" + $v' \
            server.json > server.json.new
          mv server.json.new server.json
          cat server.json
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
