name: Deploy site to GitHub Pages

# Publishes install.sh, which people pipe to sh: actions are pinned to
# commits, and mdbook to a checksum.

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "scripts/build-docs.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: mdbook, checked against its pinned hash
        run: scripts/install-mdbook.sh "$RUNNER_TEMP/bin"
      - name: The site and the docs
        run: PATH="$RUNNER_TEMP/bin:$PATH" python3 -I scripts/build-docs.py _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
