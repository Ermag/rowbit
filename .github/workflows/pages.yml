name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/**", "scripts/build-docs.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: The site and the docs
        run: python3 -I scripts/build-docs.py _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
