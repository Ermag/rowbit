name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  # No path filter on pull requests, so required checks always report.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start MariaDB 11.4 and MySQL 8.4
        run: docker compose up -d --wait
      - name: Test
        env:
          ROWBIT_REQUIRE_DB: "1"
          ROWBIT_TEST_MARIADB_URL: mysql://rowbit:rowbit@127.0.0.1:33061/rowbit_test
          ROWBIT_TEST_MYSQL_URL: mysql://rowbit:rowbit@127.0.0.1:33062/rowbit_test
        run: cargo test --workspace --locked
      - name: Check the example policy
        run: cargo run --locked -q -p rowbit-cli -- policy check examples/rowbit.yml
      - name: Check the example server settings
        env:
          ROWBIT_OIDC_CLIENT_SECRET: not-a-real-secret
          ROWBIT_SLACK_WEBHOOK_URL: https://hooks.slack.com/services/not/a/real-url
        run: cargo run --locked -q -p rowbit-cli -- server check --config examples/rowbit-server.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Browser tests of the review UI
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          ./e2e/run.sh
      - name: Database logs
        if: failure()
        run: docker compose logs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: The committed UI is a build of its source
        working-directory: web
        run: |
          npm ci
          npm run build
          git status --porcelain -- ../crates/rowbit-web/dist
          test -z "$(git status --porcelain -- ../crates/rowbit-web/dist)"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - name: The docs site builds, with no broken links
        run: python3 -I scripts/build-docs.py "$RUNNER_TEMP/site"

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-dco.sh "$BASE" "$HEAD"
