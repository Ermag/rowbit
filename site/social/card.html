<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Rowbit social preview</title>
<!-- Source for social-preview.png (1280x640). Render with headless Chrome:
     chrome --headless=new --hide-scrollbars --window-size=1280,640 --virtual-time-budget=4000 --screenshot=social-preview.png card.html -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&family=VT323&display=swap">
<style>
:root { --space:#120e28; --panel:#1c1640; --line:#4a3e90; --ink:#f2ebff; --muted:#a397d6; --amber:#ffc24b; --rose:#ff5c7a; --mint:#4fe0a8; --sky:#6cc4ff; --shadow:#07051a; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: var(--space); color: var(--ink); font-family: "Pixelify Sans", sans-serif; }
#stars { position: absolute; inset: 0; width: 1280px; height: 640px; image-rendering: pixelated; }
.wrap { position: relative; height: 100%; padding: 80px 88px; display: grid; grid-template-columns: 1fr 440px; gap: 56px; align-items: center; }
.brand { display: flex; align-items: center; gap: 24px; }
#logo { width: 120px; height: 120px; image-rendering: pixelated; }
h1 { font-family: "Press Start 2P", monospace; font-weight: 400; font-size: 64px; margin: 0; color: var(--amber); text-shadow: 6px 6px 0 var(--rose), 12px 12px 0 var(--shadow); letter-spacing: .04em; }
.tag { margin: 40px 0 0; font-size: 34px; line-height: 1.35; max-width: 20ch; }
.tag em { font-style: normal; color: var(--mint); }
.foot { margin-top: 36px; font-family: "VT323", monospace; font-size: 30px; color: var(--muted); }
.card { background: var(--panel); border: 4px solid var(--line); box-shadow: 8px 8px 0 var(--shadow); font-family: "VT323", monospace; }
.card .bar { display: flex; justify-content: space-between; padding: 10px 18px; border-bottom: 4px solid var(--line); font-family: "Press Start 2P", monospace; font-size: 13px; color: var(--muted); }
.card .bar b { color: var(--ink); font-weight: 400; }
.card .body { padding: 18px 22px 22px; font-size: 28px; line-height: 1.25; }
.sql { color: var(--sky); }
.row { display: flex; justify-content: space-between; color: var(--muted); }
.row span:last-child { color: var(--ink); }
.held { display: inline-block; margin: 14px 0 4px; padding: 4px 12px; background: var(--amber); color: var(--space); font-family: "Press Start 2P", monospace; font-size: 14px; }
.btns { display: flex; gap: 12px; margin-top: 16px; }
.btns span { flex: 1; text-align: center; padding: 10px 0; font-family: "Press Start 2P", monospace; font-size: 13px; border: 4px solid; }
.ok { color: var(--mint); border-color: var(--mint); }
.no { color: var(--rose); border-color: var(--rose); }
.undo { color: var(--sky); border-color: var(--sky); }
</style></head>
<body>
<canvas id="stars" width="427" height="214"></canvas>
<div class="wrap">
  <div>
    <div class="brand"><canvas id="logo" width="40" height="40"></canvas><h1>ROWBIT</h1></div>
    <p class="tag">A safety net for AI agents that write to your database. <em>Preview</em>, <em>approve</em>, <em>undo</em>.</p>
    <div class="foot">Open source · MCP server · MariaDB &amp; MySQL</div>
  </div>
  <div class="card">
    <div class="bar"><b>ROWBIT // review</b><span>prod-db</span></div>
    <div class="body">
      <div class="sql">UPDATE billing.refunds<br>SET status = 'refunded'</div>
      <span class="held">HELD</span>
      <div class="row"><span>agent</span><span>billing-bot</span></div>
      <div class="row"><span>rows</span><span>1,284</span></div>
      <div class="row"><span>rule</span><span>refunds-need-a-person</span></div>
      <div class="btns"><span class="ok">APPROVE</span><span class="no">REJECT</span><span class="undo">UNDO</span></div>
    </div>
  </div>
</div>
<script>
// Deterministic stars so every render is identical.
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const s = document.getElementById('stars').getContext('2d');
for (let i = 0; i < 90; i++) { s.globalAlpha = .2 + .35 * rnd(); s.fillStyle = rnd() < .1 ? '#6cc4ff' : '#a397d6'; s.fillRect(Math.round(rnd() * 427), Math.round(rnd() * 214), 1, 1); }
// The demo's planet with its orbiting bit, frozen mid-orbit.
const l = document.getElementById('logo').getContext('2d');
const cx = 20, cy = 20, tilt = -.35, at = t => { const ox = 17 * Math.cos(t), oy = 6 * Math.sin(t); return [Math.round(cx + ox * Math.cos(tilt) - oy * Math.sin(tilt)), Math.round(cy + ox * Math.sin(tilt) + oy * Math.cos(tilt))]; };
for (let y = -7; y <= 7; y++) for (let x = -7; x <= 7; x++) { if (x * x + y * y > 50) continue; l.fillStyle = (x + y > 3) ? '#d98a1f' : (x + y < -6 ? '#ffe3a1' : '#ffc24b'); l.fillRect(cx + x, cy + y, 1, 1); }
const T = 1.1;
for (let i = 0; i < 40; i++) { const [x, y] = at(T - (40 - i) * .018); l.globalAlpha = i / 40 * .6; l.fillStyle = '#6cc4ff'; l.fillRect(x, y, 1, 1); }
l.globalAlpha = 1; l.fillStyle = '#f2ebff'; const [mx, my] = at(T); l.fillRect(mx - 1, my - 1, 2, 2);
</script>
</body></html>
