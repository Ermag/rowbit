[package]
name = "rowbit-cli"
description = "The rowbit command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `cargo binstall --git https://github.com/Ermag/rowbit rowbit-cli` fetches
# the release archive instead of compiling. See docs/spec/setup.md.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/rowbit-{ version }-{ target }.tar.gz"
bin-dir = "rowbit-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "rowbit"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
getrandom.workspace = true
indexmap.workspace = true
mysql_async.workspace = true
rowbit-core.workspace = true
rowbit-engine.workspace = true
rowbit-mcp.workspace = true
rowbit-mysql.workspace = true
rowbit-policy.workspace = true
rowbit-store.workspace = true
rowbit-web.workspace = true
rpassword.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml_edit.workspace = true

[dev-dependencies]
serde_json.workspace = true
rowbit-engine.workspace = true

[lints]
workspace = true
